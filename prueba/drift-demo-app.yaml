apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: drift-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/josesfa/drift-demo.git
    targetRevision: main
    path: guestbook
  destination:
    server: https://kubernetes.default.svc
    namespace: drift-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
